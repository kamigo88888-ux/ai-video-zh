<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 電商影片自動中文化</title>
<link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body>
<header>
  <a href="#" class="brand" onclick="showList();return false">🎬 AI 電商影片自動中文化</a>
  <div class="hdr-right">
    <span id="lanUrl" class="muted small" title="同一個網路的同事用這個網址開啟工作台"></span>
    <span id="aiBadge" class="badge"></span>
    <button class="ghost" onclick="openSettings()">⚙ 設定</button>
  </div>
</header>

<!-- ===================== LIST VIEW ===================== -->
<main id="listView">
  <section class="card upload">
    <div id="drop" class="drop">
      <div class="drop-big">拖曳英文商品影片到這裡，或 <label class="link">選擇檔案<input id="fileInput" type="file" accept="video/*" multiple hidden></label></div>
      <div class="muted">支援 MP4 / MOV / WEBM，可一次選多支（批次處理）</div>
    </div>
    <div class="upload-opts">
      <label>翻譯語氣
        <select id="toneSel">
          <option value="humor">幽默有梗（預設）</option>
          <option value="natural">自然口語</option>
          <option value="pro">專業質感</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="autoRender"> 分析完成後自動輸出 MP4（批次建議勾選）</label>
    </div>
    <div id="uploadProg" class="upload-prog hidden"><div class="bar"><div></div></div><span></span></div>
  </section>

  <section class="card">
    <div class="list-head">
      <h2>影片工作</h2>
      <div class="batch-actions">
        <label class="chk"><input type="checkbox" id="selAll"> 全選</label>
        <button onclick="batchRender()">批次輸出所選</button>
        <button onclick="batchDownload()">下載所選（ZIP）</button>
      </div>
    </div>
    <table class="jobs">
      <thead><tr><th></th><th>影片</th><th>狀態</th><th>字幕</th><th>操作</th></tr></thead>
      <tbody id="jobRows"></tbody>
    </table>
    <div id="emptyHint" class="muted center pad">尚無影片，請先上傳。</div>
  </section>
</main>

<!-- ===================== EDITOR VIEW ===================== -->
<main id="editView" class="hidden">
  <div class="ed-top card">
    <button class="ghost" onclick="showList()">← 返回列表</button>
    <div class="ed-title"><b id="edName"></b><span id="edMeta" class="muted"></span></div>
    <div class="ed-status"><span id="edStatus"></span><div class="bar small"><div id="edBar"></div></div></div>
    <div class="ed-actions">
      <button id="btnRender" class="primary" onclick="renderJob()">輸出 MP4</button>
      <a id="btnDownload" class="btn hidden" href="#">⬇ 下載成品</a>
    </div>
  </div>
  <div id="edWarn" class="warn hidden"></div>

  <div class="ed-body">
    <div class="ed-left card">
      <div class="view-tabs">
        <button id="tabPrev" class="tab active" onclick="setPlayer('preview')">即時預覽（可編輯）</button>
        <button id="tabOut" class="tab" onclick="setPlayer('output')">成品影片</button>
        <label class="chk small"><input type="checkbox" id="showBoxes" onchange="draw()"> 顯示英文偵測框</label>
      </div>
      <div class="stage" id="stage">
        <video id="vid" controls playsinline preload="auto"></video>
        <canvas id="cvs"></canvas>
      </div>
      <div class="frame-info muted"><span id="tcode">00:00.00</span> · 第 <span id="fnum">0</span> 幀
        <span class="step-btns"><button class="ghost sm" onclick="stepFrame(-1)">◀ 上一幀</button><button class="ghost sm" onclick="stepFrame(1)">下一幀 ▶</button></span>
      </div>
      <video id="outVid" class="hidden" controls playsinline></video>
    </div>

    <div class="ed-right card">
      <div class="side-tabs">
        <button class="tab active" data-p="pCaps" onclick="sideTab(this)">字幕翻譯</button>
        <button class="tab" data-p="pStyle" onclick="sideTab(this)">字幕樣式</button>
        <button class="tab" data-p="pAI" onclick="sideTab(this)">AI 重翻</button>
      </div>

      <div id="pCaps" class="pane">
        <div id="capList"></div>
        <details id="ignoredBox">
          <summary>已忽略的文字（商品 / Logo / 場景文字）<span id="ignCount"></span></summary>
          <div id="ignList"></div>
        </details>
      </div>

      <div id="pStyle" class="pane hidden">
        <div class="form">
          <label>字型粗細 <select data-s="font"><option value="bold">粗體</option><option value="black">特粗</option><option value="regular">中等</option></select></label>
          <label>文字顏色 <input type="color" data-s="fill"></label>
          <label>描邊顏色 <input type="color" data-s="stroke"></label>
          <label>描邊粗細 <input type="range" min="0" max="0.25" step="0.01" data-s="stroke_ratio"><output></output></label>
          <label>字體大小（相對英文） <input type="range" min="0.5" max="1.8" step="0.05" data-s="size_scale"><output></output></label>
          <label>與英文間距 <input type="range" min="0" max="1" step="0.05" data-s="gap_ratio"><output></output></label>
          <label>位置 <select data-s="position"><option value="below">英文正下方</option><option value="above">英文正上方</option></select></label>
          <label>最多行數 <select data-s="max_lines"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
          <label>最大寬度（%畫面） <input type="range" min="40" max="98" step="1" data-s="max_width_pct"><output></output></label>
          <label class="chk"><input type="checkbox" data-s="shadow"> 文字陰影</label>
          <label class="chk"><input type="checkbox" data-s="bg_box"> 底色框</label>
          <label>底色 <input type="color" data-s="bg_color"></label>
          <label>底色透明度 <input type="range" min="0" max="1" step="0.05" data-s="bg_opacity"><output></output></label>
          <button class="ghost" onclick="resetStyle()">恢復預設樣式</button>
        </div>
        <p class="muted small">預設：白色粗體＋黑色描邊，自動依英文字大小縮放、超出畫面時自動縮小或換行。</p>
      </div>

      <div id="pAI" class="pane hidden">
        <div class="form">
          <label>語氣 <select id="aiTone"><option value="humor">幽默有梗</option><option value="natural">自然口語</option><option value="pro">專業質感</option></select></label>
          <label>額外要求（選填）<textarea id="aiInstr" rows="3" placeholder="例如：多用台灣網路用語、價格強調超划算、字數再短一點"></textarea></label>
          <button class="primary" onclick="retranslateAll()">AI 重新判斷並翻譯全部</button>
          <p class="muted small">會覆蓋目前的中文內容。單句重翻請在「字幕翻譯」分頁按 ↻。</p>
          <hr>
          <button class="ghost" onclick="reanalyze()">重新偵測英文文字</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- settings modal -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-box card">
    <h3>系統設定</h3>
    <div class="form">
      <label>Anthropic API Key <input id="setKey" type="password" placeholder="sk-ant-..."><span id="keyHint" class="muted small"></span></label>
      <label>AI 模型 <select id="setModel">
        <option value="claude-opus-5-5">Claude Opus 5.5（最佳品質）</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5（較快較省）</option>
      </select></label>
      <label>輸出畫質 CRF（越小越清晰，建議 14–18）<input id="setCrf" type="number" min="10" max="28"></label>
      <label>編碼速度 <select id="setPreset"><option value="fast">fast（快）</option><option value="medium">medium（建議）</option><option value="slow">slow（檔案較小）</option></select></label>
    </div>
    <div class="modal-actions"><button class="ghost" onclick="closeSettings()">取消</button><button class="primary" onclick="saveSettings()">儲存</button></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js?v=1"></script>
</body>
</html>
